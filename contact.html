<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Piano Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo"><a href="index.html" style="color: inherit; text-decoration: none;">Piano Studio</a></div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="lessons.html">Lessons</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>


    <div class="page-hero"><h1>Get in Touch</h1></div>
    <section id="contact" class="contact">
        <h2 class="section-title">Send a Message</h2>
        <div class="form-container">
            <!-- Tip: Hook the action attribute up to a service like Formspree to get free email routing -->
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required placeholder="Your full name">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="yourname@example.com">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required placeholder="Tell me about your experience level..."></textarea>
                </div>
                <button type="submit">Send Message</button>
            </form>
        </div>
    </section>


    <footer>
        <p>&copy; 2026 Piano Studio. All rights reserved.</p>
    </footer>

</body>
</html>
